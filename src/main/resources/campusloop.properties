# =====================================================================
#  CampusLoop configuration
#
#  Every value can be overridden without rebuilding, in this order of
#  precedence (highest first):
#    1. JVM system property   e.g. -Dcampusloop.db.password=secret
#    2. Environment variable  e.g. CAMPUSLOOP_DB_PASSWORD=secret
#    3. This file
#  (property "a.b.c" -> system property "campusloop.a.b.c"
#                     -> environment variable "CAMPUSLOOP_A_B_C")
# =====================================================================

# --- Database (user created by database/campusloop.sql) ---
db.url=jdbc:mysql://localhost:3306/campusloop?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000
db.user=campusloop
db.password=CampusLoop@2026

# --- Time zone used for "today", exchange dates and DB timestamps ---
app.timezone=Asia/Kolkata

# --- Uploaded images (kept OUTSIDE the webapp so redeploys don't delete them) ---
# Leave empty to use <user.home>/campusloop-uploads
upload.dir=
# Maximum accepted image size in bytes (5 MB)
upload.maxBytes=5242880
